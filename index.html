<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任務計時器</title>
<style>
  :root {
    --bg: #060a14;
    --text: #f2f6ff;
    --muted: #7f8ca3;
    --cyan: #3fb0f7;
    --lava: #ff7a2f;
    --line: rgba(150, 180, 220, 0.22);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue",
                 "PingFang TC", "Noto Sans TC", sans-serif;
    overflow: hidden;
  }

  #sky { position: fixed; inset: 0; display: block; }

  .stage {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4.5vh 1.5rem 0;
  }

  /* ---- 行星頁籤 ---- */
  .tabs { display: flex; gap: 0.55rem; flex-wrap: wrap; justify-content: center; }

  .tab {
    font: inherit;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-indent: 0.1em;
    padding: 0.42rem 1.15rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(18, 28, 48, 0.55);
    color: #b7c4d8;
    cursor: pointer;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
  }
  .tab:hover { border-color: rgba(180, 210, 245, 0.45); color: var(--text); }
  .tab[aria-pressed="true"] {
    background: #eef3fa;
    border-color: #eef3fa;
    color: #0d1526;
    font-weight: 600;
  }

  /* ---- 時鐘 ---- */
  .clock {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                 "Roboto Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    font-size: clamp(4.2rem, 17vw, 11rem);
    line-height: 1;
    letter-spacing: -0.02em;
    margin: 7vh 0 0;
    text-align: center;
    text-shadow: 0 0 70px rgba(120, 190, 255, 0.22);
  }

  .sun {
    margin: 1.1rem 0 0;
    font-size: 0.84rem;
    letter-spacing: 0.16em;
    text-indent: 0.16em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-height: 1.2em;
  }

  /* ---- 航程進度 ---- */
  .track {
    position: relative;
    width: min(520px, 82vw);
    height: 3px;
    margin-top: 8vh;
    background: rgba(160, 185, 215, 0.22);
    border-radius: 3px;
  }

  .fill {
    height: 100%;
    width: 0%;
    background: var(--cyan);
    border-radius: 3px;
    box-shadow: 0 0 14px rgba(63, 176, 247, 0.7);
  }

  .rocket {
    position: absolute;
    top: 50%;
    left: 0;
    width: 26px;
    height: 26px;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 7px rgba(63, 176, 247, 0.85));
  }

  .ends {
    position: absolute;
    top: 1.05rem;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    font-size: 0.76rem;
    letter-spacing: 0.22em;
    color: var(--muted);
  }

  /* ---- 控制列 ---- */
  .controls {
    display: flex;
    align-items: flex-end;
    gap: 1.1rem;
    margin-top: auto;
    margin-bottom: 9vh;
  }

  .pill {
    font: inherit;
    font-size: 1rem;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    height: 52px;
    padding: 0 1.9rem;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(30, 44, 70, 0.85), rgba(14, 22, 38, 0.85));
    color: #c3cfe2;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: border-color 0.18s, color 0.18s, opacity 0.18s;
  }
  .pill:hover { border-color: rgba(180, 210, 245, 0.5); color: var(--text); }
  .pill:disabled { opacity: 0.4; cursor: default; }

  /* ---- 火山造型的發射鍵 ---- */
  /* --heat 0→1 貫穿整座火山的升溫程度，由 .stage-1 ~ .stage-5 逐段推高 */
  .volcano-wrap { position: relative; display: flex; }

  .volcano {
    --heat: 0;
    position: relative;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    width: 172px;
    height: 92px;
    padding: 42px 0 10px;
    border: 0;
    color: #24100a;
    cursor: pointer;
    clip-path: polygon(38% 0, 62% 0, 72% 30%, 86% 62%, 100% 100%,
                       0 100%, 14% 62%, 28% 30%);
    background:
      radial-gradient(58% 34% at 50% 4%, #fff0c4 0%, #ffb03a 32%, rgba(255,122,47,0) 72%),
      linear-gradient(180deg, #ff9040 0%, #e2561c 34%, #6b2a18 78%, #37170f 100%);
    transition: filter 0.3s, opacity 0.3s;
    filter: drop-shadow(0 -6px calc(18px + var(--heat) * 40px)
                        rgba(255, 130, 50, calc(0.45 + var(--heat) * 0.5)));
    animation: rumble calc(1.15s - var(--heat) * 0.8s) linear infinite;
  }
  .volcano:hover { filter: drop-shadow(0 -6px 24px rgba(255, 150, 70, 0.7)); }
  /* 飛行中按鍵停用，但越接近噴發越不該被淡化 */
  .volcano:disabled { opacity: calc(0.45 + var(--heat) * 0.55); cursor: default; }

  @keyframes rumble {
    0%, 100% { translate: 0 0; }
    25% { translate: calc(var(--heat) * -1.7px) calc(var(--heat) * 0.9px); }
    50% { translate: calc(var(--heat) * 1.5px)  calc(var(--heat) * -0.8px); }
    75% { translate: calc(var(--heat) * -1.1px) calc(var(--heat) * -1.2px); }
  }

  /* 火山口的熱輝，隨升溫變亮變快 */
  .glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(46% 26% at 50% 2%,
                #fffbe8 0%, #ffb23c 38%, rgba(255, 110, 40, 0) 74%);
    opacity: var(--heat);
    animation: throb calc(2.4s - var(--heat) * 1.5s) ease-in-out infinite;
  }
  @keyframes throb { 0%, 100% { scale: 1; } 50% { scale: 1.14; } }

  /* 山坡上的熔岩，升溫過半才浮現 */
  .volcano::before, .volcano::after {
    content: '';
    position: absolute;
    top: 0;
    width: 13px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(180deg, #fff4cd 0%, #ffa233 26%,
                #e2521a 55%, rgba(180, 50, 10, 0) 88%);
    opacity: calc((var(--heat) - 0.45) * 1.7);
  }
  .volcano::before { left: 42%; rotate: -7deg; }
  .volcano::after  { left: 55%; rotate: 8deg; }

  /* 熔岩與熱輝都是絕對定位，字要墊高才不會被蓋掉 */
  .volcano .label {
    position: relative;
    text-shadow: 0 1px 3px rgba(60, 20, 0, 0.55);
  }

  /* 火山口冒出的火星子 */
  .ember {
    position: absolute;
    left: 50%;
    top: 4px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ffd27a;
    opacity: 0;
    pointer-events: none;
  }
  .running .ember, .erupted .ember {
    animation: spark calc(1.5s - var(--heat) * 0.95s) ease-out infinite;
  }
  .ember:nth-of-type(2) { animation-delay: 0.5s; }
  .ember:nth-of-type(3) { animation-delay: 1s; }

  @keyframes spark {
    0%   { opacity: 0;   transform: translate(-50%, 0) scale(0.5); }
    18%  { opacity: 1; }
    100% { opacity: 0;   transform: translate(-50%, 34px) scale(1.6); }
  }

  /* ---- 時間到：真正的噴發 ---- */
  .erupted .volcano {
    --heat: 1;
    animation: none;
    translate: 0 0;
    opacity: 1;
  }
  .erupted .volcano::before, .erupted .volcano::after { opacity: 1; }

  .plume {
    position: absolute;
    left: 50%;
    top: 2px;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .plume i {
    position: absolute;
    width: 7px;
    height: 7px;
    margin: -3.5px 0 0 -3.5px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff6d2 0%, #ff8f2c 55%, rgba(255, 90, 20, 0) 100%);
    opacity: 0;
  }
  .erupted .plume i {
    animation: plume var(--t) cubic-bezier(0.12, 0.62, 0.36, 1) var(--d) forwards;
  }
  @keyframes plume {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.35); }
    10%  { opacity: 1; }
    55%  { opacity: 1; transform: translate(calc(var(--dx) * 0.55), var(--dy)) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) * -0.2 + 70px)) scale(0.45); }
  }

  .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(58% 46% at 50% 86%,
                rgba(255, 186, 92, 0.55), rgba(255, 90, 20, 0) 70%);
  }
  .erupted .flash { animation: flashout 1.2s ease-out forwards; }
  @keyframes flashout {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* 最後五分鐘，每過一分鐘往噴發再推一階 */
  .stage-1 .volcano { --heat: 0.18; }
  .stage-2 .volcano { --heat: 0.36; }
  .stage-3 .volcano { --heat: 0.56; }
  .stage-4 .volcano { --heat: 0.78; }
  .stage-5 .volcano { --heat: 1; }

  /* 倒數本身也轉暖，讓「快來不及了」在視線焦點上就看得到 */
  .stage-3 .clock, .stage-4 .clock, .stage-5 .clock { color: #ffd2b4; }
  .erupted .clock { color: #ff9d5c; }

  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  @media (max-height: 620px) {
    .clock { margin-top: 3vh; }
    .track { margin-top: 4vh; }
    .controls { margin-bottom: 5vh; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<main class="stage" id="stage">
  <nav class="tabs" id="tabs">
    <button class="tab" data-planet="0" aria-pressed="true">地球</button>
    <button class="tab" data-planet="1" aria-pressed="false">火星</button>
    <button class="tab" data-planet="2" aria-pressed="false">月球</button>
    <button class="tab" data-planet="3" aria-pressed="false">木星</button>
    <button class="tab" data-planet="4" aria-pressed="false">土星</button>
  </nav>

  <h1 class="clock" id="clock">25:00</h1>
  <p class="sun" id="sun"></p>

  <div class="track">
    <div class="fill" id="fill"></div>
    <svg class="rocket" id="rocket" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21.6 12C18 9 13.9 7.5 7.2 7.5L4 9.3v5.4l3.2 1.8C13.9 16.5 18 15 21.6 12Z" fill="#5cc4ff"/>
      <path d="M7.2 7.5 4.8 3.2l4.9 4.4ZM7.2 16.5 4.8 20.8l4.9-4.4Z" fill="#2b7fc4"/>
      <circle cx="14.2" cy="12" r="1.7" fill="#081222"/>
    </svg>
    <div class="ends"><span>啟程</span><span>抵達</span></div>
  </div>

  <div class="controls">
    <div class="volcano-wrap">
      <button class="volcano" id="launch">
        <span class="glow" aria-hidden="true"></span>
        <span class="label">發射</span>
        <i class="ember"></i><i class="ember"></i><i class="ember"></i>
      </button>
      <!-- 噴發物要畫在按鍵的 clip-path 之外，否則會被裁掉 -->
      <div class="plume" id="plume" aria-hidden="true"></div>
    </div>
    <button class="pill" id="standby">待機</button>
    <button class="pill" id="rtb">返航</button>
  </div>

  <div class="flash" aria-hidden="true"></div>
</main>

<script>
(() => {
  'use strict';

  /* ================= 計時器 ================= */
  const TOTAL = 25 * 60 * 1000;
  const clockEl = document.getElementById('clock');
  const fillEl = document.getElementById('fill');
  const rocketEl = document.getElementById('rocket');
  const stageEl = document.getElementById('stage');
  const launchBtn = document.getElementById('launch');
  const standbyBtn = document.getElementById('standby');
  const rtbBtn = document.getElementById('rtb');

  let remaining = TOTAL;
  let running = false;
  // 以系統時鐘的抵達時刻為準，分頁被瀏覽器凍結時倒數才不會落後
  let arriveAt = 0;

  function render() {
    const s = Math.max(0, Math.ceil(remaining / 1000));
    clockEl.textContent =
      String(Math.floor(s / 60)).padStart(2, '0') + ':' +
      String(s % 60).padStart(2, '0');

    const p = 1 - remaining / TOTAL;          // 飛行器隨時間由左至右
    fillEl.style.width = (p * 100) + '%';
    rocketEl.style.left = (p * 100) + '%';

    launchBtn.disabled = running || remaining <= 0;
    standbyBtn.disabled = !running;
    rtbBtn.disabled = remaining === TOTAL && !running;
    stageEl.classList.toggle('running', running);

    // 剩下五分鐘起，每過一分鐘往上跳一階；歸零就真的噴發
    const stage = s > 0 && s <= 300 ? 6 - Math.ceil(s / 60) : 0;
    for (let i = 1; i <= 5; i++) stageEl.classList.toggle('stage-' + i, i === stage);
    stageEl.classList.toggle('erupted', remaining <= 0 && arriveAt > 0);
  }

  /* 噴發時往上噴的熔岩塊，位置固定寫死才不會每次重繪都跳 */
  (() => {
    const rnd = mulberry32(0x5eed);
    const plumeEl = document.getElementById('plume');
    let html = '';
    for (let i = 0; i < 18; i++) {
      const dx = (rnd() - 0.5) * 260;
      const dy = -(90 + rnd() * 170);
      html += `<i style="--dx:${dx.toFixed(1)}px;--dy:${dy.toFixed(1)}px;` +
              `--d:${(rnd() * 0.32).toFixed(2)}s;--t:${(1.5 + rnd() * 1.2).toFixed(2)}s"></i>`;
    }
    plumeEl.innerHTML = html;
  })();

  launchBtn.onclick = () => {
    if (remaining <= 0) return;
    arriveAt = Date.now() + remaining;
    running = true;
    render();
  };
  standbyBtn.onclick = () => {
    remaining = Math.max(0, arriveAt - Date.now());
    running = false;
    render();
  };
  rtbBtn.onclick = () => { running = false; remaining = TOTAL; render(); };

  /* ================= 星空（座標固定，重繪不跳動） ================= */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const STARS = (() => {
    const rnd = mulberry32(20250409);
    const out = [];
    for (let i = 0; i < 340; i++) {
      const b = rnd();
      out.push({ x: rnd(), y: rnd(), r: 0.4 + b * b * 1.1, a: 0.18 + b * 0.62 });
    }
    return out;
  })();

  /* ================= 星球粒子點陣 ================= */
  const LAT_STEP = 1.0;                        // 度
  const SPHERE = (() => {
    const pts = [];
    for (let lat = -90; lat <= 90; lat += LAT_STEP) {
      const r = lat * Math.PI / 180;
      const cy = Math.cos(r), sy = Math.sin(r);
      const n = Math.max(1, Math.round(360 * cy / LAT_STEP));
      for (let j = 0; j < n; j++) {
        const lon = (j / n) * Math.PI * 2;
        pts.push(cy * Math.sin(lon), sy, cy * Math.cos(lon));
      }
    }
    return new Float32Array(pts);
  })();
  const COUNT = SPHERE.length / 3;

  // 光源：左上前方
  const L = (() => {
    const x = -0.72, y = 0.38, z = 0.58, m = Math.hypot(x, y, z);
    return { x: x / m, y: y / m, z: z / m };
  })();

  const TILT = 1.05, ROLL = 0.22;
  const ct = Math.cos(TILT), st = Math.sin(TILT);
  const cr = Math.cos(ROLL), sr = Math.sin(ROLL);

  /* ---- 各星球色調 ---- */
  const WORLDS = [
    { hue: 210, hue2: 188, sat: 68, glow: '96,180,255' },  // 地球
    { hue: 18,  hue2: 34,  sat: 62, glow: '255,138,86'  },  // 火星
    { hue: 220, hue2: 210, sat: 8,  glow: '190,200,220' },  // 月球
    { hue: 32,  hue2: 20,  sat: 44, glow: '236,178,120' },  // 木星
    { hue: 44,  hue2: 52,  sat: 40, glow: '240,214,150' }   // 土星
  ];
  let world = WORLDS[0];
  let palette = [];

  function buildPalette() {
    palette = [];
    for (let i = 0; i < 64; i++) {
      const v = i / 63;
      const h = world.hue + (world.hue2 - world.hue) * v;
      const l = 8 + 66 * v;
      palette.push(`hsl(${h.toFixed(0)} ${world.sat}% ${l.toFixed(0)}% / ${(0.24 + 0.76 * v).toFixed(2)})`);
    }
  }
  buildPalette();

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    for (const t of document.querySelectorAll('.tab')) {
      t.setAttribute('aria-pressed', String(t === btn));
    }
    world = WORLDS[+btn.dataset.planet];
    buildPalette();
  });

  /* ---- 表面地貌：每分鐘換一次樣式 ---- */
  // 以幾組隨機方向的 3D 正弦疊加出陸塊，數值只在換樣式時重算一次
  let fieldNow = new Float32Array(COUNT);
  let fieldPrev = new Float32Array(COUNT);
  let morph = 1;                                // 0→1 的新舊地貌交融
  let surfaceIndex = -1;

  function buildField(seed, target) {
    const rnd = mulberry32(0x9e37 + seed * 2654435761);
    const waves = [];
    for (let k = 0; k < 3; k++) {
      const f = 1.8 + rnd() * 3.4;
      const th = rnd() * Math.PI * 2, ph = Math.acos(2 * rnd() - 1);
      waves.push({
        x: f * Math.sin(ph) * Math.cos(th),
        y: f * Math.cos(ph),
        z: f * Math.sin(ph) * Math.sin(th),
        p: rnd() * Math.PI * 2,
        a: [0.6, 0.3, 0.24][k]
      });
    }
    for (let i = 0, j = 0; i < COUNT; i++, j += 3) {
      const x = SPHERE[j], y = SPHERE[j + 1], z = SPHERE[j + 2];
      let v = 0;
      for (const w of waves) v += w.a * Math.sin(w.x * x + w.y * y + w.z * z + w.p);
      target[i] = v;
    }
  }

  function setSurface(index) {
    if (index === surfaceIndex) return;
    const swap = fieldPrev;
    fieldPrev = fieldNow;
    fieldNow = swap;
    buildField(index, fieldNow);
    morph = surfaceIndex < 0 ? 1 : 0;           // 首次不做交融
    surfaceIndex = index;
  }
  setSurface(0);

  /* ================= 繪製 ================= */
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, R = 0, CX = 0, CY = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    R = Math.max(W, H) * 1.15;                  // 半徑遠大於畫面，只露出上緣一道弧
    CX = W * 0.5;
    CY = H + R - H * 0.50;
  }

  function drawStars() {
    ctx.fillStyle = '#dce8ff';
    for (const s of STARS) {
      ctx.globalAlpha = s.a;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawAtmosphere() {
    const g = ctx.createRadialGradient(CX, CY, R * 0.965, CX, CY, R * 1.10);
    g.addColorStop(0.00, `rgba(${world.glow},0)`);
    g.addColorStop(0.34, `rgba(${world.glow},0.36)`);
    g.addColorStop(0.55, `rgba(${world.glow},0.15)`);
    g.addColorStop(1.00, `rgba(${world.glow},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawPlanet(spin) {
    ctx.fillStyle = '#03060e';                  // 星球本體遮住背後星星
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.fill();

    drawAtmosphere();

    const cs = Math.cos(spin), sn = Math.sin(spin);
    const p = SPHERE;
    const m = morph;

    for (let i = 0, j = 0; i < COUNT; i++, j += 3) {
      const x0 = p[j], y0 = p[j + 1], z0 = p[j + 2];

      const x1 = x0 * cs + z0 * sn;             // 自轉
      const z1 = z0 * cs - x0 * sn;
      const y2 = y0 * ct - z1 * st;             // 傾角
      const z2 = y0 * st + z1 * ct;
      if (z2 <= 0) continue;                    // 背面剔除
      const x3 = x1 * cr - y2 * sr;             // 側傾
      const y3 = x1 * sr + y2 * cr;

      const sy = CY - R * y3;
      if (sy > H || sy < -2) continue;
      const sx = CX + R * x3;
      if (sx < -2 || sx > W + 2) continue;

      const diff = x3 * L.x + y3 * L.y + z2 * L.z;
      // 半蘭伯特：受光面亮、背面暗，但暗面仍保留可見的網點
      const lit = Math.pow(0.5 + 0.5 * diff, 1.6);
      const edge = Math.pow(1 - z2, 3.5);       // 越靠輪廓越亮
      let v = 0.06 + lit * 0.80 + edge * (0.26 + 0.74 * Math.max(0, diff)) * 1.35;

      // 地貌：陸塊亮、海面暗
      const f = fieldPrev[i] + (fieldNow[i] - fieldPrev[i]) * m;
      const land = f < -0.05 ? 0 : f > 0.25 ? 1 : (f + 0.05) / 0.3;
      v *= 0.78 + 0.44 * land;
      if (v > 1) v = 1;

      ctx.fillStyle = palette[(v * 63) | 0];
      const s = v > 0.7 ? 1.7 : 1.25;
      ctx.fillRect(sx, sy, s, s);
    }
  }

  /* ================= 主迴圈 ================= */
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let spin = 0.6;
  let prev = performance.now();

  function frame(now) {
    const dt = Math.min(now - prev, 100);
    prev = now;

    if (running) {
      remaining = Math.max(0, arriveAt - Date.now());
      if (remaining === 0) running = false;
      render();
    }

    setSurface(Math.floor((TOTAL - remaining) / 60000));   // 每一分鐘換一次地貌
    if (morph < 1) morph = Math.min(1, morph + dt / 1400);

    if (!still) spin += dt * 0.000018;

    ctx.fillStyle = '#060a14';
    ctx.fillRect(0, 0, W, H);
    drawStars();
    drawPlanet(spin);

    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  render();
  requestAnimationFrame(frame);

  /* ================= 今日台北日出日落 ================= */
  (async () => {
    const sunEl = document.getElementById('sun');
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=25.03&longitude=121.56' +
                '&daily=sunrise,sunset&timezone=Asia/Taipei&forecast_days=1';
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const daily = (await res.json()).daily;
      const hhmm = (iso) => iso.split('T')[1].slice(0, 5);
      sunEl.textContent = `日出 ${hhmm(daily.sunrise[0])} ／ 日落 ${hhmm(daily.sunset[0])}`;
    } catch {
      sunEl.textContent = '離線';                // 取不到就降級，不影響計時器
    }
  })();
})();
</script>
</body>
</html>
